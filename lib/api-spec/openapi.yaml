openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Explainable Alpaca paper-trading agent API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agent
    description: Paper-trading strategy operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /agent/dashboard:
    get:
      operationId: getAgentDashboard
      tags: [agent]
      summary: Get strategy dashboard
      description: Returns account state, indicator snapshots, guardrail state, and recent activity.
      responses:
        "200":
          description: Dashboard state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDashboard"
  /agent/status:
    get:
      operationId: getAgentStatus
      tags: [agent]
      summary: Get agent status
      description: Returns the current paper/live connection and execution state.
      responses:
        "200":
          description: Agent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"
  /agent/start:
    post:
      operationId: startAgent
      tags: [agent]
      summary: Start the continuous paper-trading agent
      description: Starts an interval-driven strategy loop. Each cycle evaluates the configured universe and may submit paper orders only when every guardrail passes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAutomationInput"
      responses:
        "200":
          description: Agent started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAutomationResponse"
        "400":
          description: Invalid automation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent/stop:
    post:
      operationId: stopAgent
      tags: [agent]
      summary: Stop the continuous paper-trading agent
      description: Stops future strategy cycles without changing any open paper positions.
      responses:
        "200":
          description: Agent stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAutomationResponse"
  /agent/assets:
    get:
      operationId: getAgentAssets
      tags: [agent]
      summary: Search tradable Alpaca assets
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
      responses:
        "200":
          description: Tradable assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradableAsset"
        "502":
          description: Alpaca unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent/account:
    get:
      operationId: getAgentAccount
      tags: [agent]
      summary: Get paper account, positions, and orders
      responses:
        "200":
          description: Account overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAccountOverview"
        "502":
          description: Alpaca unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent/run:
    post:
      operationId: runStrategy
      tags: [agent]
      summary: Run one strategy scan
      description: Evaluates the configured symbols and submits paper orders only when all guardrails pass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStrategyInput"
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyRunResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent/flatten:
    post:
      operationId: flattenAgentPositions
      tags: [agent]
      summary: Flatten paper positions
      description: Closes all open paper positions through Alpaca, or simulates the action in demo mode.
      responses:
        "200":
          description: Flatten result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlattenResult"
  /agent/market/{symbol}:
    get:
      operationId: getMarketSnapshot
      tags: [agent]
      summary: Get a symbol indicator snapshot
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Indicator snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolSnapshot"
        "404":
          description: Symbol not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent/backtest:
    post:
      operationId: runBacktest
      tags: [agent]
      summary: Run a historical strategy backtest
      description: Loads daily historical bars from Alpaca market data and simulates the strategy without submitting orders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestInput"
      responses:
        "200":
          description: Backtest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Alpaca market data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent/optimize:
    post:
      operationId: optimizeBacktest
      tags: [agent]
      summary: Optimize strategy thresholds on historical data
      description: Tests a bounded grid of strategy thresholds against Alpaca historical bars without submitting orders or changing live settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeBacktestInput"
      responses:
        "200":
          description: Optimization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Alpaca market data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    BacktestInput:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 8
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        initialCapital:
          type: number
          exclusiveMinimum: 0
        settings:
          $ref: "#/components/schemas/OptimizationSettings"
        timeframe:
          type: string
          enum: [1Min, 5Min, 15Min, 1Hour, 1Day]
        feed:
          type: string
          enum: [iex, sip, delayed_sip]
      required: [symbols, start, end, initialCapital]
    OptimizeBacktestInput:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 8
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        initialCapital:
          type: number
          exclusiveMinimum: 0
        timeframe:
          type: string
          enum: [1Min, 5Min, 15Min, 1Hour, 1Day]
        feed:
          type: string
          enum: [iex, sip, delayed_sip]
      required: [symbols, start, end, initialCapital]
    OptimizationSettings:
      type: object
      properties:
        entryZ:
          type: number
        adxMax:
          type: number
        minVolumeRatio:
          type: number
      required: [entryZ, adxMax, minVolumeRatio]
    OptimizationCandidate:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/OptimizationSettings"
        score:
          type: number
        returnPct:
          type: number
        maxDrawdownPct:
          type: number
        totalTrades:
          type: number
        winRate:
          type: number
      required: [settings, score, returnPct, maxDrawdownPct, totalTrades, winRate]
    BacktestTrade:
      type: object
      properties:
        symbol:
          type: string
        side:
          type: string
          enum: [long, short]
        entryAt:
          type: string
          format: date
        exitAt:
          type: string
          format: date
        entryPrice:
          type: number
        exitPrice:
          type: number
        quantity:
          type: number
        pnl:
          type: number
        returnPct:
          type: number
        exitReason:
          type: string
      required: [symbol, side, entryAt, exitAt, entryPrice, exitPrice, quantity, pnl, returnPct, exitReason]
    BacktestResult:
      type: object
      properties:
        mode:
          type: string
          enum: [paper]
        timeframe:
          type: string
        feed:
          type: string
        symbols:
          type: array
          items:
            type: string
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        barsLoaded:
          type: number
        initialCapital:
          type: number
        finalEquity:
          type: number
        netPnl:
          type: number
        returnPct:
          type: number
        maxDrawdownPct:
          type: number
        totalTrades:
          type: number
        winningTrades:
          type: number
        losingTrades:
          type: number
        winRate:
          type: number
        benchmarkReturnPct:
          type: number
        trades:
          type: array
          items:
            $ref: "#/components/schemas/BacktestTrade"
        ranAt:
          type: string
          format: date-time
      required: [mode, timeframe, feed, symbols, start, end, barsLoaded, initialCapital, finalEquity, netPnl, returnPct, maxDrawdownPct, totalTrades, winningTrades, losingTrades, winRate, benchmarkReturnPct, trades, ranAt]
    OptimizationResult:
      type: object
      properties:
        mode:
          type: string
          enum: [paper]
        timeframe:
          type: string
        feed:
          type: string
        symbols:
          type: array
          items:
            type: string
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        initialCapital:
          type: number
        candidatesTested:
          type: number
        baseline:
          $ref: "#/components/schemas/BacktestResult"
        best:
          $ref: "#/components/schemas/BacktestResult"
        bestSettings:
          $ref: "#/components/schemas/OptimizationSettings"
        leaderboard:
          type: array
          items:
            $ref: "#/components/schemas/OptimizationCandidate"
        ranAt:
          type: string
          format: date-time
      required: [mode, timeframe, feed, symbols, start, end, initialCapital, candidatesTested, baseline, best, bestSettings, leaderboard, ranAt]
    TradableAsset:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        exchange:
          type: string
        assetClass:
          type: string
        status:
          type: string
        tradable:
          type: boolean
        fractionable:
          type: boolean
      required: [symbol, name, exchange, assetClass, status, tradable, fractionable]
    AgentAccount:
      type: object
      properties:
        equity:
          type: number
        cash:
          type: number
        buyingPower:
          type: number
        dayPnl:
          type: number
        dayPnlPct:
          type: number
        currency:
          type: string
      required: [equity, cash, buyingPower, dayPnl, dayPnlPct, currency]
    AccountPosition:
      type: object
      properties:
        symbol:
          type: string
        qty:
          type: number
        side:
          type: string
          enum: [long, short]
        avgEntryPrice:
          type: number
        currentPrice:
          type: number
        marketValue:
          type: number
        unrealizedPnl:
          type: number
      required: [symbol, qty, side, avgEntryPrice, currentPrice, marketValue, unrealizedPnl]
    AccountOrder:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        side:
          type: string
        type:
          type: string
        status:
          type: string
        qty:
          type: number
        filledQty:
          type: number
        submittedAt:
          type: string
        filledAt:
          type: ["string", "null"]
      required: [id, symbol, side, type, status, qty, filledQty, submittedAt, filledAt]
    AgentAccountOverview:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/AgentAccount"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/AccountPosition"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/AccountOrder"
        fetchedAt:
          type: string
      required: [account, positions, orders, fetchedAt]
    GuardrailState:
      type: object
      properties:
        volumeFilter:
          type: boolean
        adxFilter:
          type: boolean
        hardInvalidation:
          type: boolean
        trailingStop:
          type: boolean
        duplicatePositionCheck:
          type: boolean
        paperOnly:
          type: boolean
        entryZ:
          type: number
        exitZ:
          type: number
        invalidationZ:
          type: number
        maxPositionPct:
          type: number
        adxMax:
          type: number
        minVolumeRatio:
          type: number
      required:
        - volumeFilter
        - adxFilter
        - hardInvalidation
        - trailingStop
        - duplicatePositionCheck
        - paperOnly
        - entryZ
        - exitZ
        - invalidationZ
        - maxPositionPct
        - adxMax
        - minVolumeRatio
    AgentStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [paper, demo]
        connected:
          type: boolean
        paper:
          type: boolean
        lastRunAt:
          type: ["string", "null"]
        nextRunAt:
          type: ["string", "null"]
        running:
          type: boolean
        intervalSeconds:
          type: number
        startedAt:
          type: ["string", "null"]
        lastError:
          type: ["string", "null"]
        symbols:
          type: array
          items:
            type: string
        heartbeat:
          type: string
        guardrails:
          $ref: "#/components/schemas/GuardrailState"
      required: [mode, connected, paper, lastRunAt, nextRunAt, running, intervalSeconds, startedAt, lastError, symbols, heartbeat, guardrails]
    AgentAutomationInput:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 8
        intervalSeconds:
          type: number
          minimum: 30
          maximum: 3600
      required: [symbols, intervalSeconds]
    AgentAutomationResponse:
      type: object
      properties:
        running:
          type: boolean
        mode:
          type: string
          enum: [paper, demo]
        symbols:
          type: array
          items:
            type: string
        intervalSeconds:
          type: number
        startedAt:
          type: ["string", "null"]
        lastRunAt:
          type: ["string", "null"]
        nextRunAt:
          type: ["string", "null"]
        lastError:
          type: ["string", "null"]
        message:
          type: string
      required: [running, mode, symbols, intervalSeconds, startedAt, lastRunAt, nextRunAt, lastError, message]
    SymbolSnapshot:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: number
        sma:
          type: number
        stddev:
          type: number
        zScore:
          type: number
        adx:
          type: number
        volume:
          type: number
        avgVolume:
          type: number
        volumeRatio:
          type: number
        positionQty:
          type: number
        positionSide:
          type: string
          enum: [flat, long, short]
        unrealizedPnl:
          type: number
        signal:
          type: string
          enum: [long_entry, short_entry, exit, hold, blocked, invalidation]
        regime:
          type: string
          enum: [mean_reverting, trending, insufficient_data]
        updatedAt:
          type: string
        tradeBlockedReason:
          type: ["string", "null"]
      required:
        - symbol
        - price
        - sma
        - stddev
        - zScore
        - adx
        - volume
        - avgVolume
        - volumeRatio
        - positionQty
        - positionSide
        - unrealizedPnl
        - signal
        - regime
        - updatedAt
        - tradeBlockedReason
    StrategyActivity:
      type: object
      properties:
        id:
          type: string
        at:
          type: string
        action:
          type: string
        symbol:
          type: string
        zScore:
          type: number
        reason:
          type: string
        orderId:
          type: ["string", "null"]
        status:
          type: string
          enum: [simulated, submitted, blocked, closed]
      required: [id, at, action, symbol, zScore, reason, orderId, status]
    AgentDashboard:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AgentStatus"
        account:
          $ref: "#/components/schemas/AgentAccount"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/SymbolSnapshot"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/StrategyActivity"
        metrics:
          type: object
          properties:
            totalScans:
              type: number
            signalsToday:
              type: number
            blockedToday:
              type: number
            openPositions:
              type: number
            winRate:
              type: number
            avgHoldHours:
              type: number
          required: [totalScans, signalsToday, blockedToday, openPositions, winRate, avgHoldHours]
      required: [status, account, snapshots, activity, metrics]
    RunStrategyInput:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
            minLength: 1
        dryRun:
          type: boolean
        settings:
          $ref: "#/components/schemas/OptimizationSettings"
      required: [symbols, dryRun]
    StrategyRunResult:
      type: object
      properties:
        ranAt:
          type: string
        mode:
          type: string
          enum: [paper, demo]
        evaluated:
          type: number
        actions:
          type: array
          items:
            $ref: "#/components/schemas/StrategyActivity"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/SymbolSnapshot"
      required: [ranAt, mode, evaluated, actions, snapshots]
    FlattenResult:
      type: object
      properties:
        closed:
          type: number
        mode:
          type: string
          enum: [paper, demo]
        at:
          type: string
        message:
          type: string
      required: [closed, mode, at, message]