openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Explainable Alpaca paper-trading agent API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agent
    description: Paper-trading strategy operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /agent/dashboard:
    get:
      operationId: getAgentDashboard
      tags: [agent]
      summary: Get strategy dashboard
      description: Returns account state, indicator snapshots, guardrail state, and recent activity.
      responses:
        "200":
          description: Dashboard state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDashboard"
  /agent/status:
    get:
      operationId: getAgentStatus
      tags: [agent]
      summary: Get agent status
      description: Returns the current paper/live connection and execution state.
      responses:
        "200":
          description: Agent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"
  /agent/run:
    post:
      operationId: runStrategy
      tags: [agent]
      summary: Run one strategy scan
      description: Evaluates the configured symbols and submits paper orders only when all guardrails pass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStrategyInput"
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyRunResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent/flatten:
    post:
      operationId: flattenAgentPositions
      tags: [agent]
      summary: Flatten paper positions
      description: Closes all open paper positions through Alpaca, or simulates the action in demo mode.
      responses:
        "200":
          description: Flatten result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlattenResult"
  /agent/market/{symbol}:
    get:
      operationId: getMarketSnapshot
      tags: [agent]
      summary: Get a symbol indicator snapshot
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Indicator snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolSnapshot"
        "404":
          description: Symbol not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    AgentAccount:
      type: object
      properties:
        equity:
          type: number
        cash:
          type: number
        buyingPower:
          type: number
        dayPnl:
          type: number
        dayPnlPct:
          type: number
        currency:
          type: string
      required: [equity, cash, buyingPower, dayPnl, dayPnlPct, currency]
    GuardrailState:
      type: object
      properties:
        volumeFilter:
          type: boolean
        adxFilter:
          type: boolean
        hardInvalidation:
          type: boolean
        trailingStop:
          type: boolean
        duplicatePositionCheck:
          type: boolean
        paperOnly:
          type: boolean
        entryZ:
          type: number
        exitZ:
          type: number
        invalidationZ:
          type: number
        maxPositionPct:
          type: number
        adxMax:
          type: number
        minVolumeRatio:
          type: number
      required:
        - volumeFilter
        - adxFilter
        - hardInvalidation
        - trailingStop
        - duplicatePositionCheck
        - paperOnly
        - entryZ
        - exitZ
        - invalidationZ
        - maxPositionPct
        - adxMax
        - minVolumeRatio
    AgentStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [paper, demo]
        connected:
          type: boolean
        paper:
          type: boolean
        lastRunAt:
          type: ["string", "null"]
        nextRunAt:
          type: ["string", "null"]
        symbols:
          type: array
          items:
            type: string
        heartbeat:
          type: string
        guardrails:
          $ref: "#/components/schemas/GuardrailState"
      required: [mode, connected, paper, lastRunAt, nextRunAt, symbols, heartbeat, guardrails]
    SymbolSnapshot:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: number
        sma:
          type: number
        stddev:
          type: number
        zScore:
          type: number
        adx:
          type: number
        volume:
          type: number
        avgVolume:
          type: number
        volumeRatio:
          type: number
        positionQty:
          type: number
        positionSide:
          type: string
          enum: [flat, long, short]
        unrealizedPnl:
          type: number
        signal:
          type: string
          enum: [long_entry, short_entry, exit, hold, blocked, invalidation]
        regime:
          type: string
          enum: [mean_reverting, trending, insufficient_data]
        updatedAt:
          type: string
        tradeBlockedReason:
          type: ["string", "null"]
      required:
        - symbol
        - price
        - sma
        - stddev
        - zScore
        - adx
        - volume
        - avgVolume
        - volumeRatio
        - positionQty
        - positionSide
        - unrealizedPnl
        - signal
        - regime
        - updatedAt
        - tradeBlockedReason
    StrategyActivity:
      type: object
      properties:
        id:
          type: string
        at:
          type: string
        action:
          type: string
        symbol:
          type: string
        zScore:
          type: number
        reason:
          type: string
        orderId:
          type: ["string", "null"]
        status:
          type: string
          enum: [simulated, submitted, blocked, closed]
      required: [id, at, action, symbol, zScore, reason, orderId, status]
    AgentDashboard:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AgentStatus"
        account:
          $ref: "#/components/schemas/AgentAccount"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/SymbolSnapshot"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/StrategyActivity"
        metrics:
          type: object
          properties:
            totalScans:
              type: number
            signalsToday:
              type: number
            blockedToday:
              type: number
            openPositions:
              type: number
            winRate:
              type: number
            avgHoldHours:
              type: number
          required: [totalScans, signalsToday, blockedToday, openPositions, winRate, avgHoldHours]
      required: [status, account, snapshots, activity, metrics]
    RunStrategyInput:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
            minLength: 1
        dryRun:
          type: boolean
      required: [symbols, dryRun]
    StrategyRunResult:
      type: object
      properties:
        ranAt:
          type: string
        mode:
          type: string
          enum: [paper, demo]
        evaluated:
          type: number
        actions:
          type: array
          items:
            $ref: "#/components/schemas/StrategyActivity"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/SymbolSnapshot"
      required: [ranAt, mode, evaluated, actions, snapshots]
    FlattenResult:
      type: object
      properties:
        closed:
          type: number
        mode:
          type: string
          enum: [paper, demo]
        at:
          type: string
        message:
          type: string
      required: [closed, mode, at, message]